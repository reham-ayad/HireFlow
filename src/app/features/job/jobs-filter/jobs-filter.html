<aside class="jobs-filter">

    <div class="filter-card">

        <h3>Filters</h3>

        <!-- Job Type -->

        <div class="filter-group">

            <h4>Job Type</h4>

            <label>
                <input type="checkbox">
                Full Time
            </label>

            <label>
                <input type="checkbox">
                Part Time
            </label>

            <label>
                <input type="checkbox">
                Remote
            </label>

            <label>
                <input type="checkbox">
                Internship
            </label>

        </div>

        <!-- Experience -->

        <div class="filter-group">

            <h4>Experience</h4>

            <label>
                <input type="radio" name="exp">
                Junior
            </label>

            <label>
                <input type="radio" name="exp">
                Mid Level
            </label>

            <label>
                <input type="radio" name="exp">
                Senior
            </label>

        </div>

        <!-- Salary -->

        <div class="filter-group">

            <h4>Salary Range</h4>

            <input type="range">

            <div class="salary">

                <span>$500</span>

                <span>$5000+</span>

            </div>

        </div>

        <!-- Location -->

        <div class="filter-group">

            <h4>Location</h4>

            <select>

                <option>All Locations</option>

                <option>Remote</option>

                <option>Cairo</option>

                <option>Dubai</option>

            </select>

        </div>

        <!-- Buttons -->

        <button class="apply-btn">

            Apply Filters

        </button>

        <button class="clear-btn">

            Reset

        </button>

    </div>

</aside>
