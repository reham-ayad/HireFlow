<section class="settings-page">

    <div class="page-header">

        <h2>Settings</h2>

        <p>Manage your account preferences and security.</p>

    </div>

    <!-- Account -->

    <section class="card">

        <h3>Account Information</h3>

        <div class="form-grid">

            <div class="input-group">

                <label>Full Name</label>

                <input type="text" value="Reham Ayad">

            </div>

            <div class="input-group">

                <label>Email</label>

                <input type="email" value="reham@gmail.com">

            </div>

            <div class="input-group">

                <label>Phone</label>

                <input type="text" value="+20 100 000 0000">

            </div>

            <div class="input-group">

                <label>Location</label>

                <input type="text" value="Egypt">

            </div>

        </div>

    </section>

    <!-- Password -->

    <section class="card">

        <h3>Change Password</h3>

        <div class="form-grid">

            <div class="input-group">

                <label>Current Password</label>

                <input type="password">

            </div>

            <div class="input-group">

                <label>New Password</label>

                <input type="password">

            </div>

            <div class="input-group">

                <label>Confirm Password</label>

                <input type="password">

            </div>

        </div>

    </section>

    <!-- Notifications -->

    <section class="card">

        <h3>Notifications</h3>

        <div class="setting-item">

            <div>

                <h4>Email Notifications</h4>

                <p>Receive updates about applications.</p>

            </div>

            <input type="checkbox" checked>

        </div>

        <div class="setting-item">

            <div>

                <h4>Interview Reminders</h4>

                <p>Get reminders before interviews.</p>

            </div>

            <input type="checkbox" checked>

        </div>

        <div class="setting-item">

            <div>

                <h4>Job Recommendations</h4>

                <p>Receive jobs matching your profile.</p>

            </div>

            <input type="checkbox">

        </div>

    </section>

    <div class="actions">

        <button class="save">

            Save Changes

        </button>

    </div>

</section>
